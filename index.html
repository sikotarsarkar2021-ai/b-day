<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday Vaibhav 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff512f,#dd2476,#6a11cb);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-y:auto;
    padding:30px 10px;
}

/* Balloons */
.balloon{
    position:fixed;
    bottom:-100px;
    font-size:40px;
    animation:float 8s linear infinite;
}

.balloon:nth-child(1){left:10%;animation-delay:0s;}
.balloon:nth-child(2){left:30%;animation-delay:2s;}
.balloon:nth-child(3){left:50%;animation-delay:4s;}
.balloon:nth-child(4){left:70%;animation-delay:1s;}
.balloon:nth-child(5){left:90%;animation-delay:3s;}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

.card{
    width:380px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    z-index:10;
}

h1{
    color:#e91e63;
    margin-bottom:10px;
}

p{
    margin-bottom:20px;
    font-size:18px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#e91e63;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-bottom:20px;
    transition:.3s;
}

button:hover{
    background:#c2185b;
    transform:scale(1.05);
}

.video-box{
    margin-top:20px;
}

video{
    width:100%;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.footer{
    margin-top:20px;
    color:#666;
    font-size:14px;
}
</style>
</head>

<body>

<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>

<div class="card">

<h1>🎂 Happy Birthday Vaibhav 🎉</h1>

<p>A Special Surprise Is Waiting For You ❤️</p>

<button onclick="playMusic()">🎵 Play Birthday Song</button>

<div style="margin:20px 0;font-size:20px;font-weight:bold;color:#e91e63;line-height:1.8;">
🙏 May God Bless You Always ❤️
<br>
🎉 Enjoy Your Life & Stay Happy Forever 😊
</div>

<h2 style="color:#e91e63;">🎥 Birthday Surprise Videos</h2>

<div class="video-box">

<video controls>
    <source src="VIDEO 2.mp4" type="video/mp4">
    Your browser does not support video.
</video>

<video controls>
    <source src="VIDEo 1.mp4" type="video/mp4">
    Your browser does not support video.
</video>

</div>

<div class="footer">
Made with ❤️ By Maulik
</div>

<audio id="music">
    <source src="music 3.mpeg" type="audio/mpeg">
</audio>

</div>

<script>
function playMusic(){
    const music=document.getElementById("music");

    music.play().catch(()=>{
        alert("music file folder માં મૂકો.");
    });
}
</script>

</body>
</html>
