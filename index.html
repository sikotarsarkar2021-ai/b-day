<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Brother</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff512f,#dd2476,#6a11cb);
}

.balloon{
position:absolute;
bottom:-100px;
font-size:40px;
animation:float 8s linear infinite;
}

.balloon:nth-child(1){left:10%;animation-delay:0s;}
.balloon:nth-child(2){left:30%;animation-delay:2s;}
.balloon:nth-child(3){left:50%;animation-delay:4s;}
.balloon:nth-child(4){left:70%;animation-delay:1s;}
.balloon:nth-child(5){left:90%;animation-delay:3s;}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

.card{
background:white;
width:360px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
z-index:10;
}

h1{
color:#e91e63;
margin-bottom:15px;
}

p{
font-size:18px;
margin-bottom:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
background:#e91e63;
color:white;
cursor:pointer;
margin:8px;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#c2185b;
}

#msg{
display:none;
margin-top:20px;
color:#444;
font-size:20px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>
<div class="balloon">🎈</div>

<div class="card">

<h1>🎂 Happy Birthday Brother 🎉</h1>

<p>A Special Surprise Is Waiting For You ❤️</p>

<button onclick="playMusic()">🎵 Play Music</button>

<button onclick="showSurprise()">🎁 Open Surprise</button>

<div id="msg">
🥳 Happy Birthday Bro ❤️<br><br>
May God Bless You Always 🙏<br>
Stay Happy 😊<br><br>
🎂 Enjoy Your Day 🎉
</div>

<audio id="music">
<source src="music.mpeg" type="audio/mpeg">
</audio>

</div>

<script>

function playMusic(){
document.getElementById("music").play();
}

function showSurprise(){
document.getElementById("msg").style.display="block";
}

</script>

</body>
</html>
